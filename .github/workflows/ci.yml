name: Deploy to vercel on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      repository-projects: write
    steps:
      - uses: actions/checkout@v4
      - uses: dkershner6/vercel-set-env-action@v1
        with:
          token: ${{ secrets.VERCEL_TOKEN }}
          projectName: cs464-frontend
          envVariableKeys: NEXT_PUBLIC_STRIPE_KEY,NEXT_PUBLIC_BACKEND_URL,NEXTAUTH_SECRET,DOMAIN_NAME,GOOGLE_MAPS_API_KEY
        env:
          NEXT_PUBLIC_STRIPE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_KEY }}
          TARGET_NEXT_PUBLIC_STRIPE_KEY: preview,development,production
          TYPE_NEXT_PUBLIC_STRIPE_KEY: encrypted

          NEXT_PUBLIC_BACKEND_URL: ${{ secrets.NEXT_PUBLIC_BACKEND_URL }}
          TARGET_NEXT_PUBLIC_BACKEND_URL: preview,development,production
          TYPE_NEXT_PUBLIC_BACKEND_URL: encrypted

          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          TARGET_NEXTAUTH_SECRET: preview,development,production
          TYPE_NEXTAUTH_SECRET: encrypted

          DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
          TARGET_DOMAIN_NAME: preview,development,production
          TYPE_DOMAIN_NAME: encrypted

          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          TARGET_GOOGLE_MAPS_API_KEY: preview,development,production
          TYPE_GOOGLE_MAPS_API_KEY: encrypted

      - uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          vercel-args: "--prod"
          vercel-org-id: ${{ secrets.ORG_ID }}
          vercel-project-id: ${{ secrets.PROJECT_ID }}

      - name: preview-url
        run: |
          echo ${{ steps.vercel-deploy.outputs.preview-url }}
